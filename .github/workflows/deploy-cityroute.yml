name: Build and publish CityRoute
on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - '.github/workflows/deploy-cityroute.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cityroute-static-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actual CityRoute source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and routes
        run: |
          node --check site-src/public/app.js
          node --check site-src/public/postgres-client.js
          node --check site-src/public/postgres-ui.js
          node --check site-src/public/place-photos.js
          node --check site-src/public/map-resilience.js
          node --check site-src/public/distance-planner.js
          node --check site-src/public/itinerary.js
          node --check site-src/public/static-walks.js
          node --check site-src/public/ai-offline.js
          node --check site-src/scripts/build-pages.mjs
          mkdir -p site-src/dist
          cp site-src/public/avoidance.js site-src/public/itinerary.js site-src/public/app.js site-src/dist/
          (cd site-src && node --test tests/avoidance.mjs tests/itinerary.mjs tests/distance-planner.mjs)
      - name: Export static site to docs
        run: |
          node site-src/scripts/build-pages.mjs
          test -s docs/index.html
          test -s docs/app.js
          test -s docs/place-photos.js
          test -s docs/postgres-client.js
          test -s docs/postgres-ui.js
          test -s docs/distance-planner.js
          test -s docs/map-resilience.js
          grep -q 'id="postgresPanel"' docs/index.html
          grep -q 'id="liveMap"' docs/index.html
          grep -q 'id="rerollRoute"' docs/index.html
          grep -q 'place-photos.js' docs/index.html
      - name: Browser smoke test (mobile · Yandex map only)
        run: |
          set -e
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME_PATH"
          npm install --prefix /tmp/cityroute-e2e --no-save --silent playwright-core@1.58.0
          mkdir -p site-src/tests/node_modules
          ln -s /tmp/cityroute-e2e/node_modules/playwright-core site-src/tests/node_modules/playwright-core
          CHROME_PATH="$CHROME_PATH" node site-src/tests/yandex-browser.mjs
          CHROME_PATH="$CHROME_PATH" node site-src/tests/postgres-browser.mjs
      - name: Package static website for hosting
        run: |
          rm -f CityRoute-hosting-ready.zip
          (cd docs && zip -q -r ../CityRoute-hosting-ready.zip .)
          test -s CityRoute-hosting-ready.zip
          unzip -t CityRoute-hosting-ready.zip | tail -n 1
      - name: Push latest site to docs folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs CityRoute-hosting-ready.zip
          if ! git diff --cached --quiet; then
            git commit -m "publish: refreshed CityRoute site from latest sources"
            git push
          fi
